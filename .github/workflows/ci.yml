# Host unit tests, headless simulator checks (Linux and Windows, plus the
# Windows simulator package as a downloadable artifact), the firmware build with the
# flash / stack-headroom / libm checks, and the .ptf image as a downloadable
# artifact.
# On pull requests also a memory report: flash, SRAM, SDRAM and stack
# headroom of the PR against its base, in the run's summary.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30   # normally a few minutes; a stuck step (apt) otherwise holds the runner 6 h
    steps:
      - uses: actions/checkout@v5
      - name: Install GCC 14
        run: sudo apt-get update && sudo apt-get install -y g++-14
      # ASan aborts at start-up under the runners' 32-bit mmap randomisation.
      - name: Limit mmap randomisation for AddressSanitizer
        run: sudo sysctl -w vm.mmap_rnd_bits=28
      - name: Host tests
        run: |
          set -o pipefail
          if ! make -j"$(nproc)" host-test CC=gcc-14 CXX=g++-14 2>&1 | tee host-tests.log; then
            # Errors as annotations: readable on the run page without log access.
            grep -E "error:|\*\*\*|FAIL|[1-9][0-9]* failures|Sanitizer|DEADLYSIGNAL|runtime error" host-tests.log \
              | grep -vE "^(g\+\+|gcc|ar|objcopy)" | head -10 | while IFS= read -r line; do echo "::error::${line}"; done
            exit 1
          fi
      - name: telemetry_check self-test
        run: python3 tools/telemetry_check.py selftest

  # Headless simulator checks (`make -C sim check`): display-list budget per
  # screen, key flows, the test songs open and play. The visual diff against
  # stock snapshots skips (fixtures not in the repo).
  sim-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20   # normally a few minutes; a stuck step (apt) otherwise holds the runner 6 h
    steps:
      - uses: actions/checkout@v5
      - name: Install GCC 14 and SDL2
        run: sudo apt-get update && sudo apt-get install -y g++-14 libsdl2-dev pkg-config
      - name: Simulator checks
        run: |
          set -o pipefail
          if ! make -C sim -j"$(nproc)" check CXX=g++-14 2>&1 | tee sim-check.log; then
            # Errors as annotations: readable on the run page without log access.
            grep -E "error:|\*\*\*|script:[0-9]+|OVER BUDGET|FAIL|fail" sim-check.log \
              | grep -vE "^(g\+\+|ar) |allow-fail" | head -10 | while IFS= read -r line; do echo "::error::${line}"; done
            exit 1
          fi
      - name: Upload screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sim-check-${{ github.sha }}
          path: build/sim/*.png
          if-no-files-found: ignore

  # The same simulator checks on Windows (MSYS2 UCRT64, sim/README.md), then
  # the ready-to-run package: the static exes (OpenTracker.exe windowed,
  # opentracker-sim.exe for a terminal) and the test songs on a card folder
  # (sim/windows/package.sh). Download it from the run page.
  sim-windows:
    runs-on: windows-2025
    timeout-minutes: 30   # normally ~10 minutes; pacman or a stuck check otherwise holds the runner 6 h
    defaults:
      run:
        shell: msys2 {0}
    steps:
      # The sim scripts and check scripts are read as LF text.
      - name: Keep LF line endings
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e   # v2.33.0
        with:
          msystem: UCRT64
          update: false
          install: >-
            make
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-SDL2
            mingw-w64-ucrt-x86_64-pkgconf
      - name: Simulator checks
        run: |
          set -o pipefail
          if ! make -C sim -j"$(nproc)" check 2>&1 | tee sim-check.log; then
            # Errors as annotations: readable on the run page without log access.
            grep -E "error:|\*\*\*|script:[0-9]+|OVER BUDGET|FAIL|fail" sim-check.log \
              | grep -vE "^(g\+\+|ar) |allow-fail" | head -10 | while IFS= read -r line; do echo "::error::${line}"; done
            exit 1
          fi
      - name: The exes need only system DLLs; OpenTracker.exe is windowed
        run: |
          # A static link: no libstdc++ / libwinpthread / SDL2 DLL next to them.
          for exe in opentracker-sim.exe OpenTracker.exe; do
            if [ ! -f "build/sim/$exe" ]; then
              echo "::error::build/sim/$exe was not built"
              exit 1
            fi
            if objdump -p "build/sim/$exe" | grep -iE "DLL Name: (lib|SDL)"; then
              echo "::error::$exe depends on a non-system DLL"
              exit 1
            fi
          done
          # GUI subsystem: started from Explorer it opens no console window.
          # (No pipe into grep -q: with pipefail, grep closing the pipe early
          # makes objdump fail with SIGPIPE.)
          headers=$(objdump -p build/sim/OpenTracker.exe)
          if [[ "$headers" != *"(Windows GUI)"* ]]; then
            echo "::error::OpenTracker.exe is not a GUI-subsystem exe"
            exit 1
          fi
      - name: Package
        run: sh sim/windows/package.sh dist/OpenTracker-Sim-Windows
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: OpenTracker-Sim-Windows-${{ github.sha }}
          path: dist/OpenTracker-Sim-Windows
          if-no-files-found: error
      - name: Upload screenshots and sim logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sim-windows-check-${{ github.sha }}
          path: |
            sim-check.log
            build/sim/*.png
            build/sim/testsongs-check/*/sim.log
          if-no-files-found: ignore

  # The simulator for the TrimUI Brick (aarch64 Linux, handheld mode), cross
  # built in sim/brick/Dockerfile and packed as an Apps/ folder with the test
  # songs (sim/brick/README.md). Download it from the run page.
  brick:
    runs-on: ubuntu-24.04
    timeout-minutes: 30   # normally ~10 minutes (docker image, apt); a stuck step otherwise holds the runner 6 h
    steps:
      - uses: actions/checkout@v5
      - name: Build in the cross toolchain image
        run: |
          docker build -t opentracker-brick sim/brick
          docker run --rm -v "$PWD:/src" -w /src -u "$(id -u):$(id -g)" opentracker-brick \
            sh -c 'make -C sim PLATFORM=brick -j"$(nproc)" &&
                   aarch64-linux-gnu-strip -o build/brick/opentracker.stripped build/brick/opentracker &&
                   file build/brick/opentracker.stripped &&
                   aarch64-linux-gnu-readelf -d build/brick/opentracker.stripped | grep NEEDED'
      - name: The binary is aarch64 and needs no libstdc++ on the device
        run: |
          file build/brick/opentracker.stripped | grep -q "ARM aarch64" || { echo "::error::not an aarch64 binary"; exit 1; }
          if docker run --rm -v "$PWD:/src" -w /src opentracker-brick \
               aarch64-linux-gnu-readelf -d build/brick/opentracker.stripped | grep -E "NEEDED.*libstdc\+\+"; then
            echo "::error::opentracker links libstdc++ dynamically"
            exit 1
          fi
      - name: Test songs
        run: make -C tools/make_testsongs -j"$(nproc)" run SD="$PWD/build/sim/testsongs"
      - name: Package
        run: sh sim/brick/package.sh dist/OpenTracker-Brick
      - name: Upload the Brick package
        uses: actions/upload-artifact@v4
        with:
          name: OpenTracker-Brick-${{ github.sha }}
          path: dist/OpenTracker-Brick
          if-no-files-found: error

  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 20   # normally a few minutes; a stuck step (apt) otherwise holds the runner 6 h
    steps:
      - uses: actions/checkout@v5
      - uses: carlosperate/arm-none-eabi-gcc-action@49f4db4520f840e77ab1e99b24cfac2c540a21b1   # v1.14.1
        with:
          release: '14.2.Rel1'
      - name: Build
        run: make -j"$(nproc)"
      - name: Flash, stack headroom and libm checks
        run: python3 tools/telemetry_check.py size --size-tool arm-none-eabi-size build/opentracker.elf
      - name: Upload firmware image
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ github.sha }}
          path: build/*.ptf
          if-no-files-found: error

  # The PR (GitHub's merge commit) against its base: tools/size_report.py
  # writes a table to the job summary. Reports only; the limits are the
  # firmware job's checks.
  size-report:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20   # normally a few minutes; a stuck step (apt) otherwise holds the runner 6 h
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: carlosperate/arm-none-eabi-gcc-action@49f4db4520f840e77ab1e99b24cfac2c540a21b1   # v1.14.1
        with:
          release: '14.2.Rel1'
      - name: Build this PR
        run: |
          make -j"$(nproc)"
          cp build/opentracker.elf "$RUNNER_TEMP/head.elf"
      - name: Build the base
        run: |
          git worktree add "$RUNNER_TEMP/base" "${{ github.event.pull_request.base.sha }}"
          make -C "$RUNNER_TEMP/base" -j"$(nproc)"
          cp "$RUNNER_TEMP/base/build/opentracker.elf" "$RUNNER_TEMP/base.elf"
      - name: Memory report
        run: |
          python3 tools/size_report.py "$RUNNER_TEMP/base.elf" "$RUNNER_TEMP/head.elf" \
            --size-tool arm-none-eabi-size | tee -a "$GITHUB_STEP_SUMMARY"
